<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>게시판 알림 · 유튜브 자막</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="eyebrow"><span class="tally"></span>Board Watch</div>
      <div class="title-row">
        <h1>게시판 알림</h1>
      </div>
      <p class="subtitle">게시판 목록 페이지 주소를 넣으면 10분마다 새 글이 올라오는지 확인해서 폰으로 알림을 보내드려요.</p>
    </header>

    <section id="panel-boardwatch" class="panel boardwatch-section">
      <section class="input-row input-row-lg">
        <input id="bw-url-input" class="board-watch-input" type="url" inputmode="url" placeholder="https://... 게시판 목록 주소를 붙여넣으세요" autocomplete="off" />
        <button id="bw-add-btn" class="board-watch-btn" type="button">감시 추가</button>
      </section>

      <p class="status" id="bw-status" aria-live="polite"></p>

      <div class="bw-topic-card">
        <div class="bw-topic-label">알림 받는 방법</div>
        <div class="bw-topic-desc">
          폰에 <b>ntfy</b> 앱을 설치하고 아래 토픽을 구독하면, 감시 중인 게시판에 새 글이 올라올 때마다 알림이 와요.
        </div>
        <div class="bw-topic-value mono" id="bw-topic-value"></div>
      </div>

      <div class="bw-list" id="bw-list"></div>
    </section>

    <hr class="section-divider" />

    <section id="panel-subs" class="panel">
      <div class="section-head">
        <h2>유튜브 자막</h2>
        <div class="feed-sub">유튜브 자막이 있으면 그대로 가져오고, 없으면 음성 인식으로 새로 만들어요. 영상은 저장하지 않아요.</div>
      </div>

      <div class="subs-block" data-mode="live">
        <div class="bw-topic-label">라이브 방송 · 지금까지 진행된 부분</div>
        <section class="input-row input-row-lg">
          <input class="board-watch-input subs-input" type="url" inputmode="url" placeholder="https://youtube.com/... 라이브 주소를 붙여넣으세요" autocomplete="off" />
          <button class="board-watch-btn subs-btn" type="button">자막 추출</button>
        </section>
        <p class="status subs-status" aria-live="polite"></p>
        <div class="subs-progress" hidden><div class="subs-progress-bar"></div></div>
        <div class="subs-result" hidden></div>
      </div>

      <div class="subs-block" data-mode="vod">
        <div class="bw-topic-label">종료된 영상 · 자막이 없으면 새로 생성</div>
        <section class="input-row input-row-lg">
          <input class="board-watch-input subs-input" type="url" inputmode="url" placeholder="https://youtube.com/... 영상 주소를 붙여넣으세요" autocomplete="off" />
          <button class="board-watch-btn subs-btn" type="button">자막 만들기</button>
        </section>
        <p class="status subs-status" aria-live="polite"></p>
        <div class="subs-progress" hidden><div class="subs-progress-bar"></div></div>
        <div class="subs-result" hidden></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
