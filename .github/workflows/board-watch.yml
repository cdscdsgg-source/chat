name: Board Watch

on:
  # Triggered externally by cron-job.org every 10 minutes. GitHub's own
  # `schedule:` trigger is intentionally not used here — see commit history:
  # it was unreliable when first tried (multi-hour delays), and later,
  # running alongside cron-job.org, it caused duplicate overlapping runs
  # that piled up and got cancelled in the concurrency queue.
  workflow_dispatch: {}

concurrency:
  group: board-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # State (last-seen post ids) lives in the Actions cache, not in git.
      # It used to be committed to the repo, but every commit auto-triggered
      # a Render redeploy of the unrelated site — ~100+ redeploys/day just
      # from bot commits with no real code change. Cache keys are immutable,
      # so we always write a new key for this run and restore the most
      # recent previous one via the prefix match.
      - name: Restore board-watcher state
        uses: actions/cache/restore@v4
        with:
          path: board-watcher/state-cache
          key: board-watcher-state-${{ github.run_id }}
          restore-keys: |
            board-watcher-state-

      - name: Check todaysppc board for new posts
        run: python board-watcher/watch.py

      - name: Check MOHW boards for new posts
        run: python board-watcher/mohw_watch.py

      - name: Check user-added boards for new posts
        run: python board-watcher/generic_watch.py

      - name: Save board-watcher state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: board-watcher/state-cache
          key: board-watcher-state-${{ github.run_id }}
