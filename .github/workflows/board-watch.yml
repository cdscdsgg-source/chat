name: Board Watch

on:
  # Triggered externally by cron-job.org every 10 minutes. GitHub's own
  # `schedule:` trigger is intentionally not used here — see commit history:
  # it was unreliable when first tried (multi-hour delays), and later,
  # running alongside cron-job.org, it caused duplicate overlapping runs
  # that piled up and got cancelled in the concurrency queue.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: board-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check todaysppc board for new posts
        run: python board-watcher/watch.py

      - name: Check MOHW boards for new posts
        run: python board-watcher/mohw_watch.py

      - name: Check user-added boards for new posts
        run: python board-watcher/generic_watch.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add board-watcher/state.txt board-watcher/mohw_press_release_state.txt board-watcher/mohw_press_explain_state.txt
          if [ -d board-watcher/generic_state ]; then
            git add board-watcher/generic_state/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update board-watcher state"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push failed, rebasing onto latest origin/master (attempt $i)"
              git fetch origin master
              git rebase origin/master
              sleep 3
            done
          fi
